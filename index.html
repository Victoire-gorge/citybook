<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paris · citybook</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="page-map">
    <header data-masthead></header>
    <main class="map-page">
      <aside class="edition" aria-labelledby="edition-title">
        <h1 id="edition-title" class="edition__title" data-i18n="map.title"></h1>
        <p class="edition__subtitle" data-i18n="map.subtitle"></p>
        <figure class="edition__photo" data-edition-photo hidden></figure>
        <p class="edition__lead" data-i18n="map.lead"></p>
        <div class="transit" aria-hidden="true"></div>
        <p class="edition__count mono" data-count></p>
      </aside>

      <section class="map-frame">
        <div id="map" class="map" role="application" aria-label="Map of Paris"></div>

        <button class="layers-toggle btn btn--line" type="button" data-layers-toggle aria-expanded="false" aria-controls="layers">
          <span data-i18n="map.layers"></span>
        </button>
        <fieldset class="layers" id="layers">
          <legend class="layers__title" data-i18n="map.layers"></legend>
          <div data-layers></div>
          <label class="layer-row layer-row--fav">
            <input type="checkbox" data-favourites />
            <span class="check" aria-hidden="true"></span>
            <span class="layer-row__fav" aria-hidden="true">♥</span>
            <span data-i18n="map.favourites"></span>
          </label>
        </fieldset>

        <article class="place-card" data-card hidden aria-live="polite"></article>
        <p class="map-status" data-status data-i18n="map.loading"></p>
      </section>
    </main>
    <script type="module" src="/src/pages/map.js"></script>
  </body>
</html>
