<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adventures · citybook</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="page-adventures">
    <header data-masthead></header>
    <main class="shelf">
      <header class="shelf__head">
        <h1 class="shelf__title" data-i18n="adventures.title"></h1>
        <p class="shelf__subtitle" data-i18n="adventures.subtitle"></p>
        <button class="btn shelf__new" type="button" data-new></button>
      </header>
      <ol class="shelf__list" data-list></ol>
      <p class="shelf__empty" data-empty data-i18n="adventures.empty" hidden></p>
    </main>
    <dialog class="sheet" data-dialog aria-label="Adventure">
      <form method="dialog" class="adventure-form"></form>
    </dialog>
    <script type="module" src="/src/pages/adventures.js"></script>
  </body>
</html>
