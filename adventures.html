<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adventures · citybook</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Caveat:wght@500;700&family=DM+Serif+Display:ital@0;1&display=swap"
    />
  </head>
  <body data-palette="blue-yellow" class="page-adventures">
    <nav class="topbar" data-nav></nav>
    <main class="shelf">
      <header class="shelf__head">
        <h1 data-title></h1>
        <button class="btn" type="button" data-new data-i18n="adventures.new"></button>
      </header>
      <dialog class="sheet card" data-dialog>
        <form method="dialog" class="adventure-form" data-form></form>
      </dialog>
      <ul class="shelf__list" data-list></ul>
      <p class="shelf__empty hand" data-empty data-i18n="adventures.empty" hidden></p>
    </main>
    <script type="module" src="/src/pages/adventures.js"></script>
  </body>
</html>
