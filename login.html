<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · citybook</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="page-login">
    <header data-masthead></header>
    <main class="login">
      <form class="login__card" data-form>
        <h1 class="login__title" data-i18n="login.title"></h1>
        <p class="login__subtitle" data-i18n="login.subtitle"></p>
        <div class="transit" aria-hidden="true"></div>
        <label><span data-i18n="login.email"></span><input name="email" type="email" autocomplete="username" required /></label>
        <label><span data-i18n="login.password"></span><input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="form-error" data-error role="alert" hidden></p>
        <button class="btn" type="submit" data-i18n="login.submit"></button>
      </form>
    </main>
    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
