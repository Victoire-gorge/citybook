<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activities · citybook</title>
    <!-- ?v=2: new logo, makes browsers drop the old cached icon -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-title" content="citybook" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F7F4ED" />
  </head>
  <body class="page-activities">
    <header data-masthead></header>
    <main class="shelf">
      <header class="shelf__head">
        <h1 class="shelf__title" data-i18n="activities.title"></h1>
        <p class="shelf__subtitle" data-subtitle data-i18n="activities.subtitle"></p>
        <p class="shelf__count mono" data-count></p>
        <p class="shelf__guest" data-guest-help hidden></p>
      </header>
      <div class="subtabs" role="tablist" data-tabs>
        <button class="subtab" type="button" role="tab" data-tab="anytime" data-i18n="activities.anytime"></button>
        <button class="subtab" type="button" role="tab" data-tab="limited" data-i18n="activities.limited"></button>
        <button class="subtab" type="button" role="tab" data-tab="theatres" data-i18n="activities.theatres"></button>
      </div>
      <div class="views" role="group" data-views hidden>
        <button class="view-btn" type="button" data-view="area" data-i18n="activities.byArea"></button>
        <button class="view-btn" type="button" data-view="type" data-i18n="activities.byType"></button>
      </div>
      <div class="chips" role="group" aria-label="Types" data-chips></div>
      <div data-list></div>
      <p class="shelf__empty" data-empty data-i18n="activities.empty" hidden></p>
    </main>
    <dialog class="hood-sheet" data-hood-sheet aria-label="Neighbourhood"></dialog>
    <script type="module" src="/src/pages/activities.js"></script>
  </body>
</html>
